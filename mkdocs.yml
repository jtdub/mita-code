site_name: Mita Code
site_description: Local-first, terminal-native agentic coding assistant powered by Ollama
site_url: https://mita-code.readthedocs.io/
repo_url: https://github.com/jtdub/mita-code
repo_name: jtdub/mita-code

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Chat & Ask: guide/chat.md
      - Model Management: guide/models.md
      - Memory System: guide/memory.md
      - Codebase Indexing: guide/indexing.md
      - Skills: guide/skills.md
      - Plugins (MCP): guide/plugins.md
      - Hooks: guide/hooks.md
      - Configuration: guide/configuration.md
      - Apple Silicon: guide/apple-silicon.md
  - Reference:
      - CLI Commands: reference/cli.md
      - Configuration Schema: reference/config.md
