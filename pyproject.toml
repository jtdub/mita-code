[tool.poetry]
name = "mita-code"
version = "0.1.1a0"
description = "Local-first, terminal-native agentic coding assistant powered by Ollama"
readme = "README.md"
license = "Apache-2.0"
authors = ["James Williams <james.williams@jtdub.com>"]
packages = [{include = "mita", from = "src"}]
keywords = ["cli", "coding-assistant", "ollama", "llm", "local", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[tool.poetry.urls]
Homepage = "https://github.com/jtdub/mita-code"
Repository = "https://github.com/jtdub/mita-code"
Issues = "https://github.com/jtdub/mita-code/issues"
Documentation = "https://mita-code.readthedocs.io/"
Changelog = "https://github.com/jtdub/mita-code/blob/develop/CHANGELOG.md"

[tool.poetry.scripts]
mita = "mita.cli:app"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
typer = ">=0.9.0"
rich = ">=13.0.0"
pydantic = ">=2.0.0"
psutil = ">=5.9.0"
ollama = ">=0.3.0"
prompt-toolkit = "^3.0.52"
lancedb = "0.25.3"
tree-sitter = ">=0.23.0"
tree-sitter-language-pack = ">=0.6.0"
pandas = "^3.0.1"
pyyaml = ">=6.0"
textual = "^0.80.0"
langchain = "^1.4.0"
langchain-core = "^1.6.3"
langchain-ollama = "^1.1.0"
langchain-openai = "^1.6.2"
langchain-mcp-adapters = "^0.3.2"
langgraph = "^1.2.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.3.0"
mypy = ">=1.8.0"
pylint = ">=3.0.0"
invoke = ">=2.0.0"
isort = ">=5.12.0"
types-psutil = ">=5.9.0"
types-pyyaml = "^6.0.12.20250915"
pytest-cov = "^7.1.0"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.isort]
profile = "black"
known_first_party = ["mita"]
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mita --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mita"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]
